<header class="header">
  <div class="container">

    <!-- Logo -->
    <div class="logo">
  <div class="logo-area">
    <img [src]="imgUrl" alt="Logo" class="logo-img">
  </div>
  <span class="logo-title">Harshil's Kitchen</span>
</div>



    <!-- Navigation -->
    <nav class="nav">
      <a routerLink="/home" class="nav-link">Home</a>
      <a routerLink="/menu" class="nav-link">Menu</a>
      <a routerLink="/cart" class="nav-link">Cart</a>
      <a routerLink="/contact" class="nav-link">Contact</a>
    </nav>

    <!-- Right Action -->
    <div class="actions">
      <button class="cta-btn">Order Now</button>
    </div>

  </div>
</header>
